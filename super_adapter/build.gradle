plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.heretic_cultivator.super_adapter'
    compileSdk versions.compile_sdk

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk
        versionCode versions.version_code
        versionName versions.version_name

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    viewBinding {
        enabled = true
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    api("org.jetbrains.kotlin:kotlin-stdlib:${versions.kotlin}")
    api "androidx.recyclerview:recyclerview:${versions.recyclerview}"
    api "androidx.lifecycle:lifecycle-runtime-ktx:${versions.lifecycle}"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.hereticcultivator'
                artifactId = 'super_adapter'
                version = versions.version_name
            }
        }
    }
}